# Render Blueprint — STEPWISE API (backend only)
# Deploy this service to Render, then set VITE_API_URL on Vercel to its URL.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: stepwise-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Node version must match .node-version (>= 22.5.0)
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      # JWT security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      # CORS: set to your Vercel production URL, or leave empty to allow all in dev
      - key: CORS_ORIGIN
        sync: false
      # Database: sqlite by default (no env vars needed). Use supabase for sync.
      - key: DATABASE_PROVIDER
        value: sqlite
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional: serve the React build from Express (set VITE_API_URL empty on Vercel)
      - key: SERVE_STATIC
        value: true
      - key: TRUST_PROXY
        value: true
